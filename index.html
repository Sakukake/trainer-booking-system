
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183d78">
  <title>Be Us | 予約</title>
  <link rel="stylesheet" href="css/style.css?v=0.9.0">

  <style>
    /* Ver.0.9.0 補助スタイル */
    .hidden {
      display: none !important;
    }

    .beus-page {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
    }

    .beus-header {
      padding: 36px 0 24px;
    }

    .beus-header h1 {
      margin: 8px 0;
    }

    .beus-panel {
      margin: 16px 0 28px;
      padding: 24px;
      border-radius: 16px;
      background: #fff;
      color: #17243a;
      box-shadow: 0 4px 20px #15284a14;
    }

    .beus-field {
      display: grid;
      gap: 7px;
      margin: 18px 0;
    }

    .beus-field input,
    .beus-field select,
    .beus-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #bdc7d6;
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: #17243a;
    }

    .beus-field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .beus-menu-list {
      display: grid;
      gap: 12px;
    }

    .beus-menu-list .menu-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      cursor: pointer;
    }

    .beus-menu-list .menu-card input {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .beus-menu-list .menu-card span {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex: 1;
      flex-wrap: wrap;
    }

    .beus-menu-list .menu-card small {
      font-size: .95rem;
    }

    .beus-summary {
      padding: 16px;
      background: #f1f5f9;
      border-radius: 12px;
      margin: 20px 0;
    }

    .beus-summary p {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0;
    }

    .beus-summary .beus-total {
      border-top: 1px solid #cbd5e1;
      padding-top: 12px;
      font-weight: 700;
    }

    .beus-button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #215bd5;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .beus-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .beus-secondary {
      background: #e7edf5;
      color: #17243a;
    }

    .beus-actions {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .beus-error {
      color: #b42318;
      min-height: 1.5em;
      white-space: pre-wrap;
    }

    .beus-note {
      color: #50627b;
      font-size: .92rem;
    }

    .beus-details {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.9;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
    }

    #loading {
      padding: 24px 0;
    }

    #bookingId {
      font-size: 1.3rem;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header class="beus-header beus-page">
    <p>Be Us 予約システム | Ver.0.9.0</p>
    <h1>パーソナル予約</h1>
    <p>メニューと希望日時を選択してください。</p>
  </header>

  <main class="beus-page">

    <p id="loading" role="status">
      読み込み準備中…
    </p>

    <!-- 予約入力フォーム -->
    <form
      id="bookingForm"
      class="beus-panel hidden"
      novalidate
    >
      <h2>ご予約内容</h2>

      <h3>メニュー</h3>

      <div
        id="menuList"
        class="beus-menu-list"
        role="group"
        aria-label="予約メニュー"
      ></div>

      <h3>希望日時</h3>

      <label class="beus-field" for="date">
        <span>希望日 <strong>必須</strong></span>
        <input
          id="date"
          name="date"
          type="date"
          required
        >
      </label>

      <label class="beus-field" for="time">
        <span>開始時間 <strong>必須</strong></span>
        <select
          id="time"
          name="time"
          required
          disabled
        >
          <option value="">
            メニューと日付を選択してください
          </option>
        </select>
      </label>

      <p
        id="availabilityMessage"
        class="beus-note"
        role="status"
        aria-live="polite"
      ></p>

      <p>
        終了予定：
        <strong id="endTime">未選択</strong>
      </p>

      <!-- 料金 -->
      <div
        class="beus-summary"
        aria-label="料金の目安"
      >
        <p>
          <span>メニュー料金</span>
          <span id="menuPrice">0円</span>
        </p>

        <p>
          <span>施設利用料</span>
          <span id="facilityFee">0円</span>
        </p>

        <p class="beus-total">
          <span>合計予定金額</span>
          <span id="totalPrice">0円</span>
        </p>
      </div>

      <h3>お客様情報</h3>

      <label class="beus-field" for="name">
        <span>お名前 <strong>必須</strong></span>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          maxlength="100"
          required
        >
      </label>

      <label class="beus-field" for="kana">
        <span>
          フリガナ（カタカナ）
          <strong>必須</strong>
        </span>
        <input
          id="kana"
          name="kana"
          type="text"
          maxlength="100"
          required
        >
      </label>

      <label class="beus-field" for="phone">
        <span>電話番号 <strong>必須</strong></span>
        <input
          id="phone"
          name="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          required
        >
      </label>

      <label class="beus-field" for="email">
        <span>
          メールアドレス
          <strong>必須</strong>
        </span>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >
      </label>

      <label class="beus-field" for="notes">
        <span>ご要望・備考（任意）</span>
        <textarea
          id="notes"
          name="notes"
          maxlength="2000"
        ></textarea>
      </label>

      <p
        id="formError"
        class="beus-error"
        role="alert"
        aria-live="assertive"
      ></p>

      <button
        class="beus-button"
        type="submit"
      >
        予約内容を確認する
      </button>
    </form>

    <!-- 予約確認画面 -->
    <section
      id="confirmation"
      class="beus-panel hidden"
      aria-labelledby="confirmationHeading"
    >
      <h2 id="confirmationHeading">
        予約内容の確認
      </h2>

      <p>
        内容をご確認のうえ、
        予約を確定してください。
      </p>

      <div
        id="confirmationText"
        class="beus-details"
      ></div>

      <p
        id="confirmError"
        class="beus-error"
        role="alert"
        aria-live="assertive"
      ></p>

      <div class="beus-actions">
        <button
          id="confirmButton"
          class="beus-button"
          type="button"
        >
          この内容で予約する
        </button>

        <button
          id="backButton"
          class="beus-button beus-secondary"
          type="button"
        >
          入力画面に戻る
        </button>
      </div>
    </section>

    <!-- 予約完了画面 -->
    <section
      id="completed"
      class="beus-panel hidden"
      aria-labelledby="completedHeading"
    >
      <h2 id="completedHeading">
        予約を受け付けました
      </h2>

      <p>
        予約番号：
        <span id="bookingId"></span>
      </p>

      <div
        id="completedText"
        class="beus-details"
      ></div>

      <p class="beus-note">
        予約内容を控えておいてください。
      </p>

      <button
        id="newButton"
        class="beus-button"
        type="button"
      >
        新しい予約をする
      </button>
    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 接続設定 -->
  <script src="js/supabase-config.js?v=0.9.0"></script>

  <!-- お客様用予約処理 -->
  <script src="js/script.js?v=0.9.0"></script>

</body>
</html>
